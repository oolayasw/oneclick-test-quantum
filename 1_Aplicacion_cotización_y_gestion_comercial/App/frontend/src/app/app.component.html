<!-- MALA PRACTICA: Navbar y layout en el componente raiz sin componente Navbar separado -->
<!-- Logica de autenticacion mezclada directamente en el template -->

<!-- Navbar: visible solo cuando esta autenticado -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow" *ngIf="svc.estaAutenticado()">
  <a class="navbar-brand font-weight-bold" href="#">
    <i class="fas fa-file-invoice-dollar text-warning mr-2"></i>QuoteFlow
  </a>
  <button class="navbar-toggler" type="button" (click)="menuAbierto = !menuAbierto">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" [class.show]="menuAbierto">
    <ul class="navbar-nav mr-auto">
      <li class="nav-item">
        <a class="nav-link" routerLink="/dashboard" routerLinkActive="active">
          <i class="fas fa-tachometer-alt mr-1"></i>Dashboard
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/clientes" routerLinkActive="active">
          <i class="fas fa-users mr-1"></i>Clientes
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/catalogo" routerLinkActive="active">
          <i class="fas fa-boxes mr-1"></i>Catálogo
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/cotizaciones" routerLinkActive="active">
          <i class="fas fa-file-alt mr-1"></i>Cotizaciones
        </a>
      </li>
      <!-- MALA PRACTICA: Logica de roles directamente en template sin directiva personalizada -->
      <li class="nav-item" *ngIf="esSupervisorOAdmin()">
        <a class="nav-link" routerLink="/aprobaciones" routerLinkActive="active">
          <i class="fas fa-check-circle mr-1"></i>Aprobaciones
          <span class="badge badge-warning ml-1" *ngIf="svc.pendientesAprobacion > 0">
            {{svc.pendientesAprobacion}}
          </span>
        </a>
      </li>
    </ul>
    <div class="navbar-text">
      <!-- MALA PRACTICA: Acceso directo a svc.usuarioActual en template -->
      <span class="text-light mr-2">
        <i class="fas fa-user-circle mr-1"></i>
        {{svc.usuarioActual?.nombre}}
        <span class="badge badge-secondary ml-1">{{svc.usuarioActual?.rol}}</span>
      </span>
      <button class="btn btn-outline-light btn-sm" (click)="cerrarSesion()">
        <i class="fas fa-sign-out-alt mr-1"></i>Salir
      </button>
    </div>
  </div>
</nav>

<!-- UN SOLO router-outlet para toda la app -->
<div [class.container-fluid]="svc.estaAutenticado()"
     [class.mt-4]="svc.estaAutenticado()"
     [class.px-4]="svc.estaAutenticado()">
  <router-outlet></router-outlet>
</div>
